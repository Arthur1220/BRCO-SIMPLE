version = 0.1

[default.global.parameters]
stack_name = "brco-api"
region = "sa-east-1"

[default.build.parameters]
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
# Os segredos (PanelPassword, AdminJwtSecret, NetlifyProxySecret) são pedidos no
# `sam deploy --guided` ou passados com --parameter-overrides; nunca versione-os aqui.
