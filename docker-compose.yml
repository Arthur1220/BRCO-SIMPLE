# Desenvolvimento local: DynamoDB Local (o backend roda com `npm run dev` e o
# frontend com `npm run dev`; em produção a API é uma Lambda e o frontend fica no Netlify).
#   docker compose up -d
services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    container_name: brco-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
