AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  BRCO - OIDC do GitHub Actions e role de deploy da stack brco-api.
  Aplicado uma única vez, à mão (ver DEPLOY.md, seção CI/CD).

Parameters:
  GitHubRepo:
    Type: String
    Default: Arthur1220/BRCO-SIMPLE
    Description: Repositório (dono/nome) autorizado a assumir a role
  DeployBranch:
    Type: String
    Default: main
    Description: Única branch que pode fazer deploy
  AppStackName:
    Type: String
    Default: brco-api
    Description: Nome da stack SAM da API (samconfig.toml)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      'false' se a conta já tiver o provider token.actions.githubusercontent.com
      (só pode existir um por conta)

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: brco-github-deploy
      Description: Assumida pelo GitHub Actions (push na main) para o sam deploy da API
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            # TagSession: o configure-aws-credentials marca a sessão com dados do workflow.
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}
      Policies:
        - PolicyName: sam-deploy-brco-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ---------------------------------------------------------------
              # CloudFormation: só a stack da API (e a leitura da stack do bucket
              # de artefatos do SAM, criada no primeiro deploy manual).
              # ---------------------------------------------------------------
              - Sid: CloudFormationAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: CloudFormationSamManagedStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              # O template usa a transform do SAM.
              - Sid: CloudFormationSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              # Ações sem suporte a recurso específico.
              - Sid: CloudFormationGlobal
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'

              # ---------------------------------------------------------------
              # Bucket de artefatos do SAM (resolve_s3 = true)
              # ---------------------------------------------------------------
              - Sid: SamArtifactsBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
              - Sid: SamArtifactsObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*

              # ---------------------------------------------------------------
              # Lambda (ApiFunction + Function URL): nomes gerados brco-api-*
              # ---------------------------------------------------------------
              - Sid: LambdaAppFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*

              # ---------------------------------------------------------------
              # DynamoDB: as 3 tabelas da stack (brco-api-*). Sem DeleteTable:
              # as tabelas têm DeletionPolicy Retain.
              # ---------------------------------------------------------------
              - Sid: DynamoDBAppTables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*

              # ---------------------------------------------------------------
              # IAM: só a role de execução da Lambda que o SAM cria (brco-api-*).
              # ---------------------------------------------------------------
              - Sid: IamAppExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
              # Só a policy gerenciada de logs que o SAM anexa à role da Lambda.
              - Sid: IamAttachBasicExecution
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: IamPassAppRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

              # ---------------------------------------------------------------
              # CloudWatch Logs: o grupo /aws/lambda/brco-api do template.
              # ---------------------------------------------------------------
              - Sid: LogsAppLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}:*
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Valor da variável AWS_DEPLOY_ROLE_ARN no GitHub
    Value: !GetAtt DeployRole.Arn
